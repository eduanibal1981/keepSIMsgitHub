name: Embedded secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify redacted scanning and credential regressions
        run: python3 -m unittest discover -s tools -p 'test_scan_embedded_secrets.py' -v
      - name: Scan active source and report archived exposure inventory
        run: python3 tools/scan_embedded_secrets.py --repo .
      - id: toolchain
        name: Read the release Node version
        run: python3 -c "import json, os; print('node=' + json.load(open('deployment/release-toolchains.json'))['node'], file=open(os.environ['GITHUB_OUTPUT'], 'a'))"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Verify credential resolution and callback rotation
        run: node --test test/provider_secrets.test.cjs test/turn_credentials_security.test.cjs test/credential_rotation_consumers.test.cjs
