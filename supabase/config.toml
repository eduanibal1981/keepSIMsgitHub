
# PayPal redirects a plain browser here with no Authorization header, so JWT
# verification has to be off. The function is read-only and moves no money.
[functions.paypal-return]
enabled = true
verify_jwt = false
entrypoint = "./functions/paypal-return/index.ts"

[functions.fetch_zendit_offers]
enabled = true
verify_jwt = true
import_map = "./functions/fetch_zendit_offers/deno.json"
entrypoint = "./functions/fetch_zendit_offers/index.ts"

[functions.make-call]
enabled = true
verify_jwt = true
entrypoint = "./functions/make-call/index.ts"

[functions.notification-email-verification]
enabled = true
verify_jwt = true
entrypoint = "./functions/notification-email-verification/index.ts"

[functions.telnyx-cdr]
enabled = true
verify_jwt = false
entrypoint = "./functions/telnyx-cdr/index.ts"

