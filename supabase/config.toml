
# PayPal redirects a plain browser here with no Authorization header, so JWT
# verification has to be off. The function is read-only and moves no money.
[functions.paypal-return]
enabled = true
verify_jwt = false
entrypoint = "./functions/paypal-return/index.ts"

[functions.fetch_zendit_offers]
enabled = true
verify_jwt = true
import_map = "./functions/fetch_zendit_offers/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/fetch_zendit_offers/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/fetch_zendit_offers/*.html" ]
