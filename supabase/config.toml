
[auth.email.template.recovery]
subject = "Your KeepSIMs password reset code"
content_path = "./supabase/templates/recovery.html"

# PayPal redirects a plain browser here with no Authorization header, so JWT
# verification has to be off. The function is read-only and moves no money.
[functions.paypal-return]
enabled = true
verify_jwt = false
entrypoint = "./functions/paypal-return/index.ts"

[functions.fetch_zendit_offers]
enabled = true
verify_jwt = true
import_map = "./functions/fetch_zendit_offers/deno.json"
entrypoint = "./functions/fetch_zendit_offers/index.ts"

[functions.make-call]
enabled = true
verify_jwt = true
entrypoint = "./functions/make-call/index.ts"

[functions.process-wallet-refund]
enabled = true
verify_jwt = true
entrypoint = "./functions/process-wallet-refund/index.ts"

[functions.notification-email-verification]
enabled = true
verify_jwt = true
entrypoint = "./functions/notification-email-verification/index.ts"

[functions.telnyx-cdr]
enabled = true
verify_jwt = false
entrypoint = "./functions/telnyx-cdr/index.ts"


# Task 4: external providers authenticate in the handler; users/internal services
# additionally retain gateway JWT verification. Deploy with these exact settings.
[functions.process-voicemail]
enabled = true
verify_jwt = true
entrypoint = "./functions/process-voicemail/index.ts"

[functions.admin-telnyx-billing]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-telnyx-billing/index.ts"

[functions.liveness-verification]
enabled = true
verify_jwt = true
entrypoint = "./functions/liveness-verification/index.ts"

[functions.liveness-verification-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/liveness-verification-webhook/index.ts"

[functions.twilio-voice-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/twilio-voice-webhook/index.ts"

[functions.sms-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/sms-webhook/index.ts"

[functions.waba-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/waba-webhook/index.ts"

# Task 5: client checkout tokens are verified; PayPal signs external callbacks.
[functions.create-paypal-order]
enabled = true
verify_jwt = true
entrypoint = "./functions/create-paypal-order/index.ts"

[functions.capture-paypal-order]
enabled = true
verify_jwt = true
entrypoint = "./functions/capture-paypal-order/index.ts"

[functions.paypal-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/paypal-webhook/index.ts"

[functions.manage-dids]
enabled = true
verify_jwt = true
entrypoint = "./functions/manage-dids/index.ts"

[functions.second-number-lifecycle]
enabled = true
verify_jwt = true
entrypoint = "./functions/second-number-lifecycle/index.ts"

# pg_net callers authenticate with a Vault secret inside each handler.
[functions.purge-accounts]
enabled = true
verify_jwt = false
entrypoint = "./functions/purge-accounts/index.ts"

[functions.send-admin-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-admin-email/index.ts"

# Public aggregate health only. Detailed fleet data stays service/admin-only.
[functions.health]
enabled = true
verify_jwt = false
entrypoint = "./functions/health/index.ts"

# Catalogue sync authenticates x-sync-secret and fails closed.
[functions.sync-esim-catalogue]
enabled = true
verify_jwt = false
entrypoint = "./functions/sync-esim-catalogue/index.ts"

# Authenticated refresh-hint ingress; the handler checks a dedicated Vault secret.
[functions.esimaccess-events]
verify_jwt = false
