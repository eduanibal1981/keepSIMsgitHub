name: keep_sims
description: "SIM Shield — Protect your expat SIM cards from deactivation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Backend
  supabase_flutter: ^2.12.4

  # Routing
  go_router: ^17.3.0

  # Auth
  google_sign_in: ^7.2.0
  local_auth: ^2.3.0

  # UI / UX
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  intl: ^0.20.2
  video_player: ^2.8.2
  collection: ^1.18.0

  # Utilities
  url_launcher: ^6.3.1
  # Receives io.supabase.keepsims://payment-success when PayPal bounces the
  # browser back. Already resolved as a supabase_flutter transitive; declared
  # directly because the payment flow imports it.
  app_links: ^7.2.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  onesignal_flutter: ^5.5.5
  # Functional Error Handling
  dartz: ^0.10.1
  connectivity_plus: 6.1.5
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  share_plus: ^10.1.3
  path_provider: ^2.1.5
  flutter_localizations:
    sdk: flutter
  dartssh2: ^2.18.0
  file_picker: ^11.0.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  sentry_flutter: ^8.13.0
  # Home-screen widget bridge (G4). Only the shared key/value store + the
  # "widget was tapped" stream; the rendering is native on both platforms.
  home_widget: ^0.9.3
  firebase_app_check: ^0.4.5+2
  telnyx_webrtc: 4.4.0
  flutter_webrtc: 1.4.1
  permission_handler: 12.0.1
  flutter_callkit_incoming: ^3.1.5
  audio_session: ^0.1.25
  proximity_sensor: ^2.0.0
  phone_numbers_parser: 9.0.28
  country_picker: 2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.4
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_lint: ^3.1.4

  # Testing
  mocktail: ^1.0.4
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/fonts/
    - assets/sounds/
    - assets/splashfastcp.mp4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher-icon.png"
  adaptive_icon_background: "#0A295A"
  adaptive_icon_foreground: "assets/images/launcher-foreground.png"
  # Keeps the complete shield and checkmark inside Android's circular safe area.
  adaptive_icon_foreground_inset: 22
